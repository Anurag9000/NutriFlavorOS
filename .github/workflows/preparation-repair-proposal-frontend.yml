name: validate-preparation-repair-proposal-frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-preparation-repair-proposal-frontend-main
  cancel-in-progress: true

jobs:
  proposal-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate proposal client boundary
        run: python scripts/validate_preparation_repair_proposal_frontend_contract.py
      - name: Validate proposal acceptance frontend
        run: python scripts/validate_preparation_repair_acceptance_frontend.py
      - name: Validate proposal invalidation administration
        run: python scripts/validate_preparation_repair_proposal_invalidation_frontend.py
      - name: Validate protected proposal workspace and route
        run: python scripts/validate_preparation_repair_proposal_workspace.py

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check proposal workspaces
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error title=TypeScript::${line}"
            done < typecheck.log
          fi
          exit "$status"
      - name: Upload type-check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proposal-frontend-typecheck-${{ github.sha }}
          path: frontend/typecheck.log
          if-no-files-found: error
          retention-days: 14
      - name: Run proposal client and workspace tests
        working-directory: frontend
        run: >-
          npm test --
          src/lib/preparationRepairProposalApi.test.ts
          src/pages/PreparationRepairProposals.test.tsx
          src/pages/PreparationRepairProposalInvalidation.test.tsx
