name: validate-preparation-repair-postgres

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-preparation-repair-postgres-main
  cancel-in-progress: true

jobs:
  repair-acceptance-races:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nutriflavor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nutriflavor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nutriflavor_test
      JWT_SECRET: repair-postgres-ci-secret-at-least-32-bytes
      AUTO_CREATE_SCHEMA: "false"
      SEED_REVIEWED_STORAGE_POLICIES: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pip check

      - name: Compile real PostgreSQL migration, race, recovery, support, and transient-failure harness
        run: >-
          python -m compileall -q
          backend/api/database_error_handlers.py
          backend/domain/preparation_schedule_support_export.py
          backend/services/household_plan_lifecycle_service.py
          backend/services/preparation_operations_service.py
          backend/services/preparation_operations_service_impl.py
          backend/services/preparation_repair_proposal_acceptance_service.py
          backend/services/preparation_repair_proposal_invalidation_service.py
          backend/services/preparation_repair_source_acceptance_guard_service.py
          backend/services/preparation_repair_approval_guard_service.py
          backend/services/preparation_schedule_approval_service.py
          backend/services/preparation_schedule_support_export_service.py
          backend/services/preparation_schedule_support_export_authorized_service.py
          backend/services/preparation_task_execution_service.py
          backend/services/preparation_task_completion_service.py
          backend/tests/postgres_preparation_fixture.py
          backend/tests/test_database_operational_error_handler.py
          backend/tests/test_preparation_repair_acceptance_postgres.py
          backend/tests/test_preparation_repair_source_acceptance_postgres.py
          backend/tests/test_preparation_repair_proposal_invalidation_postgres.py
          backend/tests/test_preparation_repair_plan_cancellation_postgres.py
          backend/tests/test_preparation_repair_plan_approval_postgres.py
          backend/tests/test_preparation_repair_calendar_supersession_postgres.py
          backend/tests/test_preparation_repair_calendar_approval_postgres.py
          backend/tests/test_preparation_schedule_completion_postgres.py
          backend/tests/test_preparation_repair_recovery_postgres.py
          backend/tests/test_preparation_repair_transient_failures_postgres.py
          backend/tests/test_preparation_repair_connection_loss_postgres.py
          backend/tests/test_preparation_schedule_support_export_postgres.py
          scripts/export_preparation_schedule_support_snapshot.py
          scripts/rehearse_repair_source_acceptance_migration_postgres.py
          scripts/validate_database_transient_failure_boundary.py
          scripts/validate_preparation_schedule_support_export.py
          scripts/validate_preparation_repair_connection_loss_contract.py
          scripts/validate_preparation_repair_migration_rehearsal.py
          scripts/validate_preparation_repair_plan_cancellation_race.py
          scripts/validate_preparation_repair_calendar_supersession_race.py
          scripts/validate_preparation_schedule_completion_authority.py
          scripts/validate_preparation_repair_recovery_postgres.py

      - name: Upgrade PostgreSQL to migration predecessor 0017
        run: |
          alembic upgrade 20260802_0017
          python - <<'PY'
          from sqlalchemy import text
          from backend.database import SessionLocal, engine
          assert engine.dialect.name == "postgresql", engine.dialect.name
          db = SessionLocal()
          try:
              revision = db.execute(text("SELECT version_num FROM alembic_version")).scalar_one()
              assert revision == "20260802_0017", revision
          finally:
              db.close()
          PY

      - name: Seed 64 valid historical acceptances at 0017
        run: >-
          python scripts/rehearse_repair_source_acceptance_migration_postgres.py
          seed
          --count 64
          --manifest reports/repair-source-acceptance-migration-seed.json

      - name: Upgrade populated PostgreSQL to reviewed head 0018
        run: |
          alembic upgrade head
          python scripts/rehearse_repair_source_acceptance_migration_postgres.py \
            verify \
            --manifest reports/repair-source-acceptance-migration-seed.json \
            --report reports/repair-source-acceptance-migration-report.json
          python - <<'PY'
          from backend.database import engine
          from backend.schema_revision import CURRENT_ALEMBIC_REVISION
          from backend.schema_verification import verify_runtime_schema
          assert engine.dialect.name == "postgresql", engine.dialect.name
          assert CURRENT_ALEMBIC_REVISION == "20260802_0018"
          verify_runtime_schema()
          PY

      - name: Validate lifecycle, migration, dependency, completion, support, recovery, and database-failure contracts
        run: |
          python scripts/validate_preparation_repair_source_acceptance_contract.py
          python scripts/validate_preparation_repair_migration_rehearsal.py
          python scripts/validate_preparation_repair_proposal_invalidation.py
          python scripts/validate_preparation_repair_plan_cancellation_race.py
          python scripts/validate_preparation_repair_calendar_supersession_race.py
          python scripts/validate_preparation_task_execution_replacement_guard.py
          python scripts/validate_preparation_task_execution_eligibility_contract.py
          python scripts/validate_preparation_schedule_completion_authority.py
          python scripts/validate_preparation_schedule_support_export.py
          python scripts/validate_preparation_repair_connection_loss_contract.py
          python scripts/validate_preparation_repair_recovery_postgres.py
          python scripts/validate_database_transient_failure_boundary.py
          python scripts/validate_repair_release_identity.py

      - name: Run real PostgreSQL lifecycle, support, recovery, connection-loss, timeout, and deadlock evidence
        run: >-
          pytest -q
          backend/tests/test_database_operational_error_handler.py
          backend/tests/test_preparation_repair_acceptance_postgres.py
          backend/tests/test_preparation_repair_source_acceptance_postgres.py
          backend/tests/test_preparation_repair_proposal_invalidation_postgres.py
          backend/tests/test_preparation_repair_plan_cancellation_postgres.py
          backend/tests/test_preparation_repair_plan_approval_postgres.py
          backend/tests/test_preparation_repair_calendar_supersession_postgres.py
          backend/tests/test_preparation_repair_calendar_approval_postgres.py
          backend/tests/test_preparation_schedule_completion_postgres.py
          backend/tests/test_preparation_schedule_support_export_postgres.py
          backend/tests/test_preparation_repair_recovery_postgres.py
          backend/tests/test_preparation_repair_connection_loss_postgres.py
          backend/tests/test_preparation_repair_transient_failures_postgres.py
          --junitxml=reports/preparation-repair-postgres.xml

      - uses: actions/upload-artifact@v7
        with:
          name: preparation-repair-postgres-evidence
          path: |
            reports/preparation-repair-postgres.xml
            reports/repair-source-acceptance-migration-seed.json
            reports/repair-source-acceptance-migration-report.json
          if-no-files-found: error
