name: validate-preparation-repair-commit-ack-loss

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-preparation-repair-commit-ack-loss-main
  cancel-in-progress: true

jobs:
  commit-acknowledgement-loss:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nutriflavor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nutriflavor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nutriflavor_test
      JWT_SECRET: commit-ack-loss-ci-secret-at-least-32-bytes
      AUTO_CREATE_SCHEMA: "false"
      SEED_REVIEWED_STORAGE_POLICIES: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pip check

      - name: Compile COMMIT acknowledgement and multi-instance recovery evidence
        run: >-
          python -m compileall -q
          backend/main.py
          backend/api/database_error_handlers.py
          backend/services/preparation_repair_source_acceptance_guard_service.py
          backend/tests/postgres_commit_ack_drop_proxy.py
          backend/tests/postgres_preparation_fixture.py
          backend/tests/test_postgres_commit_ack_drop_proxy.py
          backend/tests/test_preparation_repair_commit_ack_loss_postgres.py
          backend/tests/test_preparation_repair_multi_instance_recovery_postgres.py
          scripts/probe_preparation_repair_multi_instance_recovery.py
          scripts/validate_database_transient_failure_boundary.py
          scripts/validate_database_recovery_hardening_release.py
          scripts/validate_preparation_repair_commit_ack_loss_contract.py
          scripts/validate_preparation_repair_commit_ack_loss_release.py
          scripts/validate_preparation_repair_multi_instance_recovery_contract.py
          scripts/validate_repair_release_identity.py

      - name: Upgrade PostgreSQL to reviewed head 0018
        run: |
          alembic upgrade head
          python - <<'PY'
          from backend.database import engine
          from backend.schema_revision import CURRENT_ALEMBIC_REVISION
          from backend.schema_verification import verify_runtime_schema
          assert engine.dialect.name == "postgresql", engine.dialect.name
          assert CURRENT_ALEMBIC_REVISION == "20260802_0018"
          verify_runtime_schema()
          PY

      - name: Validate database transient-failure boundary
        run: python scripts/validate_database_transient_failure_boundary.py
      - name: Validate COMMIT acknowledgement loss contract
        run: python scripts/validate_preparation_repair_commit_ack_loss_contract.py
      - name: Validate controlled multi-instance exact recovery
        run: python scripts/validate_preparation_repair_multi_instance_recovery_contract.py
      - name: Validate COMMIT acknowledgement loss release
        run: python scripts/validate_preparation_repair_commit_ack_loss_release.py
      - name: Validate broad database recovery hardening release
        run: python scripts/validate_database_recovery_hardening_release.py
      - name: Validate synchronized repair release identity
        run: python scripts/validate_repair_release_identity.py

      - name: Run PostgreSQL protocol, COMMIT loss, and multi-instance evidence
        run: >-
          pytest -q
          backend/tests/test_postgres_commit_ack_drop_proxy.py
          backend/tests/test_preparation_repair_commit_ack_loss_postgres.py
          backend/tests/test_preparation_repair_multi_instance_recovery_postgres.py
          --junitxml=reports/preparation-repair-commit-ack-loss.xml

      - uses: actions/upload-artifact@v7
        with:
          name: preparation-repair-commit-ack-loss-evidence
          path: reports/preparation-repair-commit-ack-loss.xml
          if-no-files-found: error
