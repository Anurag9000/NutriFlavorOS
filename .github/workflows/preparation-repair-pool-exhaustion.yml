name: validate-preparation-repair-pool-exhaustion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-preparation-repair-pool-exhaustion-main
  cancel-in-progress: true

jobs:
  pool-exhaustion-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nutriflavor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nutriflavor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nutriflavor_test
      JWT_SECRET: pool-exhaustion-ci-secret-at-least-32-bytes
      AUTO_CREATE_SCHEMA: "false"
      SEED_REVIEWED_STORAGE_POLICIES: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pip check

      - name: Compile pool timeout, sustained pressure, worker recycle, retry, metrics, and PostgreSQL evidence
        run: >-
          python -m compileall -q
          backend/main.py
          backend/api/database_error_handlers.py
          backend/database_recovery_metrics.py
          backend/database_recovery_openmetrics.py
          backend/exact_database_retry.py
          backend/services/preparation_repair_source_acceptance_guard_service.py
          backend/tests/postgres_preparation_fixture.py
          backend/tests/test_database_operational_error_handler.py
          backend/tests/test_database_recovery_metrics.py
          backend/tests/test_database_recovery_metric_integrity.py
          backend/tests/test_database_recovery_openmetrics.py
          backend/tests/test_database_pool_timeout_boundary.py
          backend/tests/test_exact_database_retry.py
          backend/tests/test_preparation_repair_pool_exhaustion_postgres.py
          backend/tests/test_preparation_repair_pool_pressure_postgres.py
          backend/tests/test_preparation_repair_worker_recycle_postgres.py
          scripts/probe_preparation_repair_worker_recycle.py
          scripts/validate_database_recovery_hardening_release.py
          scripts/validate_database_recovery_metric_integrity.py
          scripts/validate_preparation_repair_pool_exhaustion_contract.py
          scripts/validate_preparation_repair_pool_pressure_contract.py
          scripts/validate_preparation_repair_worker_recycle_contract.py
          scripts/validate_preparation_repair_worker_recycle_release.py
          scripts/validate_database_recovery_observability.py
          scripts/validate_database_transient_failure_boundary.py
          scripts/validate_preparation_repair_serialization_retry_contract.py
          scripts/validate_repair_release_identity.py

      - name: Upgrade PostgreSQL to reviewed head 0018
        run: |
          alembic upgrade head
          python - <<'PY'
          from backend.database import engine
          from backend.schema_revision import CURRENT_ALEMBIC_REVISION
          from backend.schema_verification import verify_runtime_schema
          assert engine.dialect.name == "postgresql", engine.dialect.name
          assert CURRENT_ALEMBIC_REVISION == "20260802_0018"
          verify_runtime_schema()
          PY

      - name: Validate database transient-failure boundary
        run: python scripts/validate_database_transient_failure_boundary.py
      - name: Validate bounded serialization retry contract
        run: python scripts/validate_preparation_repair_serialization_retry_contract.py
      - name: Validate single pool exhaustion recovery contract
        run: python scripts/validate_preparation_repair_pool_exhaustion_contract.py
      - name: Validate controlled sustained pool pressure contract
        run: python scripts/validate_preparation_repair_pool_pressure_contract.py
      - name: Validate controlled application-worker recycle contract
        run: python scripts/validate_preparation_repair_worker_recycle_contract.py
      - name: Validate controlled application-worker recycle release
        run: python scripts/validate_preparation_repair_worker_recycle_release.py
      - name: Validate database recovery metric integrity
        run: python scripts/validate_database_recovery_metric_integrity.py
      - name: Validate database recovery observability
        run: python scripts/validate_database_recovery_observability.py
      - name: Validate database recovery hardening release
        run: python scripts/validate_database_recovery_hardening_release.py
      - name: Validate synchronized repair release identity
        run: python scripts/validate_repair_release_identity.py

      - name: Run complete retry, metrics, pool timeout, pressure, and worker recycle evidence
        run: >-
          pytest -q
          backend/tests/test_database_operational_error_handler.py
          backend/tests/test_database_recovery_metrics.py
          backend/tests/test_database_recovery_metric_integrity.py
          backend/tests/test_database_recovery_openmetrics.py
          backend/tests/test_database_pool_timeout_boundary.py
          backend/tests/test_exact_database_retry.py
          backend/tests/test_preparation_repair_pool_exhaustion_postgres.py
          backend/tests/test_preparation_repair_pool_pressure_postgres.py
          backend/tests/test_preparation_repair_worker_recycle_postgres.py
          --junitxml=reports/preparation-repair-pool-exhaustion.xml

      - uses: actions/upload-artifact@v7
        with:
          name: preparation-repair-pool-exhaustion-evidence
          path: reports/preparation-repair-pool-exhaustion.xml
          if-no-files-found: error
