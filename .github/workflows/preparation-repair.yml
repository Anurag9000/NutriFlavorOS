name: validate-preparation-repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-preparation-repair-main
  cancel-in-progress: true

jobs:
  repair-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: sqlite:////tmp/nutriflavor-preparation-repair.db
      JWT_SECRET: preparation-repair-ci-secret-at-least-32-bytes
      AUTO_CREATE_SCHEMA: "false"
      SEED_REVIEWED_STORAGE_POLICIES: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pip check
      - name: Compile complete repair lifecycle
        run: >-
          python -m compileall -q
          backend/api/preparation_routes.py
          backend/api/preparation_repair_proposal_routes.py
          backend/api/preparation_operations_routes.py
          backend/domain/preparation_repair.py
          backend/domain/preparation_repair_proposals.py
          backend/domain/preparation_schedule_replay.py
          backend/engines/prep_schedule_repair.py
          backend/preparation_repair_proposal_models.py
          backend/preparation_operations_models.py
          backend/services/preparation_repair_proposal_creation_service.py
          backend/services/preparation_repair_proposal_read_service.py
          backend/services/preparation_repair_proposal_acceptance_service.py
          backend/services/preparation_repair_approval_guard_service.py
          backend/services/preparation_schedule_replay_service.py
          backend/services/preparation_schedule_approval_service.py
          backend/migrations/versions/20260802_0015_preparation_repair_proposals.py
          backend/migrations/versions/20260802_0016_repair_proposal_calendar_identity.py
          backend/migrations/versions/20260802_0017_repair_proposal_acceptance.py
          scripts/benchmark_preparation_repair.py
          scripts/repair_preparation_schedule.py
          scripts/validate_preparation_repair_contract.py
          scripts/validate_preparation_repair_proposal_contract.py
          scripts/validate_preparation_schedule_replay_contract.py
          scripts/validate_preparation_repair_acceptance_contract.py
          scripts/validate_preparation_repair_acceptance_frontend.py
          scripts/validate_preparation_repair_proposal_workspace.py
      - name: Upgrade an empty SQLite database to the exact reviewed head
        run: |
          rm -f /tmp/nutriflavor-preparation-repair.db
          alembic upgrade head
          python -c "from backend.schema_revision import CURRENT_ALEMBIC_REVISION; from backend.schema_verification import verify_runtime_schema; assert CURRENT_ALEMBIC_REVISION == '20260802_0017'; verify_runtime_schema()"
      - name: Validate advisory repair contract
        run: python scripts/validate_preparation_repair_contract.py
      - name: Validate proposal lifecycle contract
        run: python scripts/validate_preparation_repair_proposal_contract.py
      - name: Validate method-aware replay contract
        run: python scripts/validate_preparation_schedule_replay_contract.py
      - name: Validate accepted repaired draft contract
        run: python scripts/validate_preparation_repair_acceptance_contract.py
      - name: Validate accepted repaired draft frontend
        run: python scripts/validate_preparation_repair_acceptance_frontend.py
      - name: Validate protected proposal workspace
        run: python scripts/validate_preparation_repair_proposal_workspace.py
      - name: Validate generated OpenAPI release contract
        run: python scripts/validate_openapi_contracts.py
      - name: Run complete repair backend tests
        run: >-
          pytest -q
          backend/tests/test_preparation_schedule_repair.py
          backend/tests/test_preparation_schedule_replay.py
          backend/tests/test_preparation_repair_advisory_boundary.py
          backend/tests/test_preparation_repair_api.py
          backend/tests/test_preparation_repair_benchmark.py
          backend/tests/test_preparation_repair_cli.py
          backend/tests/test_preparation_repair_proposals.py
          backend/tests/test_preparation_repair_proposal_api.py
          backend/tests/test_preparation_repair_proposal_execution_boundary.py
          backend/tests/test_preparation_repair_proposal_acceptance.py
          backend/tests/test_preparation_repair_approval_guard.py
          backend/tests/test_openapi_contract_validator.py
      - name: Run benchmark and retain report
        run: python scripts/benchmark_preparation_repair.py --output reports/preparation-repair.json
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check accepted repair frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Run complete repair frontend tests
        working-directory: frontend
        run: >-
          npm test --
          src/pages/PreparationRepairReview.test.tsx
          src/lib/preparationRepairProposalApi.test.ts
          src/pages/PreparationRepairProposals.test.tsx
      - uses: actions/upload-artifact@v7
        with:
          name: preparation-repair-report
          path: reports/preparation-repair.json
          if-no-files-found: error
