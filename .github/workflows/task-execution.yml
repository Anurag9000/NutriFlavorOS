name: validate-task-execution

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-task-execution-main
  cancel-in-progress: true

jobs:
  postgres-task-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nutriflavos
          POSTGRES_PASSWORD: task-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: nutriflavos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutriflavos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt "psycopg[binary]"
      - run: pip check
      - name: Fresh PostgreSQL migration
        env:
          DATABASE_URL: postgresql+psycopg://nutriflavos:task-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/nutriflavos
        run: alembic upgrade head
      - name: Focused task execution service tests
        run: pytest -q backend/tests/test_preparation_task_execution_service.py
      - name: Task execution PostgreSQL race probe
        env:
          DATABASE_URL: postgresql+psycopg://nutriflavos:task-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/nutriflavos
        run: python scripts/check_preparation_task_execution_concurrency.py
