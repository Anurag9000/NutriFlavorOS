name: validate-preparation-authority

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-preparation-authority-main
  cancel-in-progress: true

jobs:
  authority-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pip check
      - name: Validate authoritative entry points
        run: python scripts/validate_preparation_authoritative_entrypoints.py
      - name: Validate route, completion, coverage, and migration contracts
        run: >-
          pytest -q
          backend/tests/test_preparation_operations_route_resolution.py
          backend/tests/test_preparation_authoritative_service_resolution.py
          backend/tests/test_preparation_task_completion_authoritative_entry.py
          backend/tests/test_preparation_task_execution_authoritative_service.py
          backend/tests/test_preparation_operations_coverage_authoritative_entry.py
          backend/tests/test_preparation_task_execution_migration.py
