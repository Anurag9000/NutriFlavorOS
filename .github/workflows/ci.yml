name: validate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-main
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pip check
      - run: python -m compileall -q backend scripts
      - name: Repository contract gate
        run: >-
          python scripts/validate_repository_contracts.py
          --output /tmp/repository_contracts.json
      - name: Isolated catalog import-order gate
        run: >-
          python scripts/validate_catalog_import_order.py
          --output /tmp/catalog_import_order.json
      - name: Generated OpenAPI contract gate
        run: >-
          python scripts/validate_openapi_contracts.py
          --output /tmp/openapi_contracts.json
      - name: Frontend OpenAPI binding gate
        run: >-
          python scripts/validate_frontend_openapi_bindings.py
          --output /tmp/frontend_openapi_bindings.json
      - name: Preparation operations frontend binding gate
        run: >-
          python scripts/validate_frontend_openapi_bindings.py
          --contract contracts/preparation_operations_frontend_bindings.json
          --output /tmp/preparation_operations_frontend_bindings.json
      - name: Household plan frontend binding gate
        run: >-
          python scripts/validate_frontend_openapi_bindings.py
          --contract contracts/household_plan_frontend_bindings.json
          --output /tmp/household_plan_frontend_bindings.json
      - run: pytest -q backend/tests
      - name: Deterministic planner benchmark gate
        run: >-
          python scripts/benchmark_planners.py
          --generate-seed 17
          --slots 4
          --options-per-slot 3
          --repeats 2
          --max-objective-gap 1.0
          --output /tmp/planner_benchmark.json
      - name: Preparation heuristic exact-comparison gate
        run: >-
          python scripts/benchmark_preparation_schedulers.py
          benchmarks/preparation_scheduler_small.json
          --heuristic-repeats 2
          --maximum-tasks 10
          --maximum-nodes 500000
          --require-heuristic-complete
          --require-exact-optimal
          --maximum-gap-minutes 0
          --maximum-exact-nodes 500000
          --output /tmp/preparation_scheduler_benchmark.json
      - name: Temporal ranking and diversity gate
        run: >-
          python scripts/benchmark_rankers.py
          --generate-seed 17
          --user-count 18
          --item-group-count 3
          --items-per-group 8
          --interactions-per-user 6
          --k 5
          --require-model bayesian_popularity_recommender
          --require-model item_knn_recommender
          --require-model mmr_diversity_reranker
          --minimum-best-recall 0.0
          --minimum-best-coverage 0.10
          --maximum-hard-violations 0
          --output /tmp/ranking_benchmark.json
      - name: Rolling-origin forecasting benchmark gate
        run: >-
          python scripts/benchmark_forecasters.py
          --generate-seed 17
          --length 56
          --season-length 7
          --intermittent-probability 0.20
          --minimum-train-size 28
          --horizon 7
          --step 7
          --require-model seasonal_naive
          --require-model tsb_intermittent_demand
          --maximum-mae 10
          --output /tmp/forecast_benchmark.json
      - name: Perishable inventory replay gate
        run: >-
          python scripts/simulate_inventory.py
          benchmarks/inventory_small.json
          --minimum-fill-rate 1.0
          --maximum-waste-units 1.0
          --maximum-stockout-units 0.0
          --output /tmp/inventory_simulation.json
      - name: Forecast-to-inventory closed-loop gate
        run: >-
          python scripts/evaluate_forecast_inventory.py
          benchmarks/forecast_inventory_small.json
          --require-model seasonal_naive
          --require-model tsb_intermittent_demand
          --minimum-best-fill-rate 0.80
          --maximum-least-waste 2.0
          --output /tmp/forecast_inventory_evaluation.json
      - name: Fresh SQLite migration
        env:
          DATABASE_URL: sqlite:///ci-fresh.db
        run: alembic upgrade head
      - name: Immutable food-evidence dry-run import
        env:
          DATABASE_URL: sqlite:///ci-fresh.db
          NUTRIFLAVOR_COMMIT_SHA: ${{ github.sha }}
        run: >-
          python scripts/import_food_evidence.py
          benchmarks/food_evidence_import_small.json
          --manifest /tmp/food_evidence_dry_run.json
      - name: Immutable food-evidence atomic apply
        env:
          DATABASE_URL: sqlite:///ci-fresh.db
          NUTRIFLAVOR_COMMIT_SHA: ${{ github.sha }}
        run: >-
          python scripts/import_food_evidence.py
          benchmarks/food_evidence_import_small.json
          --apply
          --operator github-actions
          --manifest /tmp/food_evidence_apply.json
      - name: Immutable food-evidence idempotent reapply
        env:
          DATABASE_URL: sqlite:///ci-fresh.db
          NUTRIFLAVOR_COMMIT_SHA: ${{ github.sha }}
        run: >-
          python scripts/import_food_evidence.py
          benchmarks/food_evidence_import_small.json
          --apply
          --operator github-actions
          --manifest /tmp/food_evidence_reapply.json
      - name: Immutable evidence lifecycle dry run
        env:
          DATABASE_URL: sqlite:///ci-fresh.db
          NUTRIFLAVOR_COMMIT_SHA: ${{ github.sha }}
        run: >-
          python scripts/manage_food_evidence_lifecycle.py
          benchmarks/food_evidence_lifecycle_small.json
          --manifest /tmp/food_evidence_lifecycle_dry_run.json
      - name: Immutable evidence lifecycle atomic apply
        env:
          DATABASE_URL: sqlite:///ci-fresh.db
          NUTRIFLAVOR_COMMIT_SHA: ${{ github.sha }}
        run: >-
          python scripts/manage_food_evidence_lifecycle.py
          benchmarks/food_evidence_lifecycle_small.json
          --apply
          --operator github-actions
          --manifest /tmp/food_evidence_lifecycle_apply.json
      - name: Immutable evidence lifecycle idempotent reapply
        env:
          DATABASE_URL: sqlite:///ci-fresh.db
          NUTRIFLAVOR_COMMIT_SHA: ${{ github.sha }}
        run: >-
          python scripts/manage_food_evidence_lifecycle.py
          benchmarks/food_evidence_lifecycle_small.json
          --apply
          --operator github-actions
          --manifest /tmp/food_evidence_lifecycle_reapply.json
      - name: Retain backend validation reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-validation-reports
          path: /tmp/*.json
          if-no-files-found: error

  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nutriflavos
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: nutriflavos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutriflavos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt "psycopg[binary]"
      - run: pip check
      - name: Fresh PostgreSQL migration
        env:
          DATABASE_URL: postgresql+psycopg://nutriflavos:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/nutriflavos
        run: alembic upgrade head
      - name: Concurrent inventory and reservation probe
        env:
          DATABASE_URL: postgresql+psycopg://nutriflavos:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/nutriflavos
        run: python scripts/check_inventory_concurrency.py
      - name: Full-request idempotency concurrency probe
        env:
          DATABASE_URL: postgresql+psycopg://nutriflavos:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/nutriflavos
        run: python scripts/check_full_request_idempotency.py
      - name: Preparation evidence concurrency probe
        env:
          DATABASE_URL: postgresql+psycopg://nutriflavos:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/nutriflavos
        run: python scripts/check_preparation_evidence_concurrency.py
      - name: Immutable food-evidence concurrency probe
        env:
          DATABASE_URL: postgresql+psycopg://nutriflavos:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/nutriflavos
        run: python scripts/check_evidence_history_concurrency.py
      - name: Immutable evidence lifecycle concurrency probe
        env:
          DATABASE_URL: postgresql+psycopg://nutriflavos:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/nutriflavos
        run: python scripts/check_evidence_lifecycle_concurrency.py
      - name: Preparation operations concurrency probe
        env:
          DATABASE_URL: postgresql+psycopg://nutriflavos:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/nutriflavos
        run: python scripts/check_preparation_operations_concurrency.py
      - name: Household plan lifecycle concurrency probe
        env:
          DATABASE_URL: postgresql+psycopg://nutriflavos:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/nutriflavos
        run: python scripts/check_household_plan_concurrency.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: nutriflavos:ci
