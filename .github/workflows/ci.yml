name: validate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-main
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend scripts
      - run: pytest -q backend/tests
      - name: Deterministic planner benchmark gate
        run: >-
          python scripts/benchmark_planners.py
          --generate-seed 17
          --slots 4
          --options-per-slot 3
          --repeats 2
          --max-objective-gap 1.0
          --output /tmp/planner_benchmark.json
      - name: Fresh SQLite migration
        env:
          DATABASE_URL: sqlite:///ci-fresh.db
        run: alembic upgrade head

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nutriflavos
          POSTGRES_PASSWORD: nutriflavos
          POSTGRES_DB: nutriflavos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutriflavos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt "psycopg[binary]"
      - name: Fresh PostgreSQL migration
        env:
          DATABASE_URL: postgresql+psycopg://nutriflavos:nutriflavos@localhost:5432/nutriflavos
        run: alembic upgrade head
      - name: Concurrent inventory and reservation probe
        env:
          DATABASE_URL: postgresql+psycopg://nutriflavos:nutriflavos@localhost:5432/nutriflavos
        run: python scripts/check_inventory_concurrency.py
      - name: Full-request idempotency concurrency probe
        env:
          DATABASE_URL: postgresql+psycopg://nutriflavos:nutriflavos@localhost:5432/nutriflavos
        run: python scripts/check_full_request_idempotency.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: nutriflavos:ci
