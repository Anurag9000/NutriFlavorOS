name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend scripts
      - run: pytest -q backend/tests
      - name: Fresh SQLite migration
        env: {DATABASE_URL: 'sqlite:///ci-fresh.db'}
        run: alembic upgrade head
  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: nutriflavos, POSTGRES_PASSWORD: nutriflavos, POSTGRES_DB: nutriflavos}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nutriflavos"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt psycopg[binary]
      - env: {DATABASE_URL: 'postgresql+psycopg://nutriflavos:nutriflavos@localhost:5432/nutriflavos'}
        run: alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with: {context: ., push: false, tags: nutriflavos:ci}
