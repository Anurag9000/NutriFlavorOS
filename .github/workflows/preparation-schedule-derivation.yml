name: validate-preparation-schedule-derivation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-preparation-schedule-derivation-main
  cancel-in-progress: true

jobs:
  derivation-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite:////tmp/nutriflavor-schedule-derivation.db
      JWT_SECRET: schedule-derivation-ci-secret-at-least-32-bytes
      AUTO_CREATE_SCHEMA: "false"
      SEED_REVIEWED_STORAGE_POLICIES: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pip check
      - name: Compile derivation evidence implementation
        run: >-
          python -m compileall -q
          backend/domain/preparation_schedule_derivation.py
          backend/services/preparation_schedule_derivation_service.py
          backend/api/preparation_schedule_derivation_routes.py
          backend/tests/test_preparation_schedule_derivation.py
          scripts/validate_preparation_schedule_derivation_contract.py
          scripts/validate_preparation_schedule_derivation_frontend.py
      - name: Upgrade empty database to exact reviewed head
        run: |
          rm -f /tmp/nutriflavor-schedule-derivation.db
          alembic upgrade head
          python -c "from backend.schema_verification import verify_runtime_schema; verify_runtime_schema()"
      - name: Validate backend derivation contract
        run: python scripts/validate_preparation_schedule_derivation_contract.py
      - name: Validate protected derivation frontend
        run: python scripts/validate_preparation_schedule_derivation_frontend.py
      - name: Run backend derivation tests
        run: pytest -q backend/tests/test_preparation_schedule_derivation.py
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check derivation inspector
        working-directory: frontend
        run: npm run typecheck
      - name: Run derivation client and inspector tests
        working-directory: frontend
        run: >-
          npm test --
          src/lib/preparationScheduleDerivationApi.test.ts
          src/pages/PreparationScheduleDerivation.test.tsx
